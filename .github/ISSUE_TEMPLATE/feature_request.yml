name: Feature request
description: Suggest a visual, API, performance, or accessibility improvement
title: "[Idea]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this improve?
      description: Explain the use case or limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
      description: Describe the behavior or API you have in mind.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Visual references or alternatives
